<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic DOM Manipulation - Counter App</title>
    <link rel="stylesheet" href="task3.css">
</head>
<body>

    <div class="counter-container">
        <h1>Counter App</h1>
        <div id="counterValue" class="counter-display">0</div>
        
        <div class="btn-group">
            <button id="decrementBtn" class="btn-decrement">Minus</button>
            <button id="incrementBtn" class="btn-increment">Plus</button>
        </div>
        
        <button id="resetBtn" class="btn-reset">Reset</button>
    </div>

    <script src="task3.js"></script>
</body>
</html>
