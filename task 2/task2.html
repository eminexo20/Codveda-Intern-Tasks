<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Form - Task 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="task2.css">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="form-card">
    <h3 class="form-title text-center mb-4">Registration Form</h3>

  
    <div id="successAlert" class="alert alert-success d-none text-center fw-bold" role="alert">
      Form submitted successfully!
    </div>

    <form id="interactiveForm" novalidate>
  
      <div class="mb-3">
        <label for="name" class="form-label">Full Name *</label>
        <input type="text" class="form-control" id="name" placeholder="John Doe">
        <div class="error-msg" id="nameError">Full name is required (at least 3 characters).</div>
      </div>

 
      <div class="mb-3">
        <label for="email" class="form-label">Email Address *</label>
        <input type="email" class="form-control" id="email" placeholder="example@mail.com">
        <div class="error-msg" id="emailError">Please enter a valid email address.</div>
      </div>


      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number *</label>
        <input type="tel" class="form-control" id="phone" placeholder="+1234567890">
        <div class="error-msg" id="phoneError">Please enter a valid phone number.</div>
      </div>

      
      <div class="mb-3">
        <label for="password" class="form-label">Password *</label>
        <input type="password" class="form-control" id="password" placeholder="********">
        <div class="password-strength-bar">
          <div id="strengthIndicator" class="strength-fill"></div>
        </div>
        <small id="strengthText" class="text-muted d-block mt-1">Password strength: Very weak</small>
        <div class="error-msg" id="passwordError">Password must be at least 8 characters with uppercase, lowercase, and a number.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Submit</button>
    </form>
  </div>
</div>

<script src="task2.js"></script>
</body>
</html>
